# Updates für Python-Pakete und GitHub-Actions – einmal pro Woche gesammelt, höchstens fünf offene Vorschläge
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Nur melden, wenn eine neue Version aus dem erlaubten Bereich fällt – nicht jede Untergrenze hochziehen
    # (sonst müssten Nutzer von pipx/pip ohne Not die neuesten Pakete haben; der Installer nimmt ohnehin die aktuellen)
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
