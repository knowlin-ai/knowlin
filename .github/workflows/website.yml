name: Website (knowlin.de)
# Baut website/ mit tools/website.py, prüft sie im Browser (axe, Tastatur, Breiten) und veröffentlicht sie auf GitHub
# Pages. GitHub Pages gibt es kostenlos nur für öffentliche Repos – solange privat, wird nur gebaut und geprüft.
on:
  push:
    branches: [main]
    paths: ["website/**", "tools/website*.py"]
  # Nach jedem Release, sobald der Installer am Release hängt: neu bauen, damit „Download“ auf die neue Version zeigt.
  # (Läuft über workflow_run auf main – GitHub Pages veröffentlicht nur von main, nicht von einem Release-Tag.)
  workflow_run:
    workflows: ["Installer (Windows)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: true
jobs:
  bauen:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: npm install --no-save axe-core@4.10.2
      - name: Neuestes Release (für den Download-Knopf)
        # höchste Version, nicht das zuletzt angelegte Release (seit 0.38.49)
        run: echo "KNOWLIN_RELEASE=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '[.[].tagName] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last' 2>/dev/null)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python tools/website_pruefen.py pruefung --axe node_modules/axe-core/axe.min.js
        env:
          KNOWLIN_IMPRESSUM: ${{ vars.KNOWLIN_IMPRESSUM }}   # Name|Straße|PLZ Ort – nur als Repo-Variable, nie im Repo
      - name: Impressum vollständig?
        if: ${{ !github.event.repository.private }}
        run: |
          if [ -f pruefung/seite/.impressum-offen ]; then
            echo "::error::Impressum – Name und Anschrift fehlen (Repo-Variable KNOWLIN_IMPRESSUM)"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pruefung/seite
  veroeffentlichen:
    needs: bauen
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
