name: Links
# Externe Links in Oberfläche, Website und Doku (seit 0.38.33 – ein toter Link zu Pollens App-Katalog fiel erst beim
# Ausprobieren auf). Wöchentlich und von Hand; nicht bei jedem Push, weil fremde Seiten mal kurz hängen.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/links_pruefen.py
