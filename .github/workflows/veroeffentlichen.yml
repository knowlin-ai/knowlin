name: Veröffentlichen (PyPI)
# Baut das Paket „knowlin“ und lädt es bei jedem GitHub-Release auf PyPI – ohne API-Schlüssel: PyPI vertraut diesem
# Workflow über „Trusted Publishing“ (OpenID Connect). Läuft erst, wenn die Repo-Variable PYPI_AKTIV = ja gesetzt ist
# (nachdem der Trusted Publisher auf pypi.org eingetragen ist) – vorher wird nur gebaut und geprüft.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: paket
          path: dist/
  pypi:
    needs: bauen
    if: ${{ vars.PYPI_AKTIV == 'ja' && github.repository == 'knowlin-ai/knowlin' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/knowlin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paket
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
