[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knowlin_link"
version = "0.1.0"
description = "Knowlin Link – connect Reachy Mini to Knowlin on your PC"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["reachy-mini"]

[project.entry-points."reachy_mini_apps"]
knowlin_link = "knowlin_link.main:KnowlinLink"

[tool.setuptools]
packages = ["knowlin_link"]

[tool.setuptools.package-data]
knowlin_link = ["static/*"]
