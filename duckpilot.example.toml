# Kopieren nach duckpilot.toml und anpassen. Alles ist optional.

[backend]
type = "sim"                     # "sim" = Simulator am PC, "robotd" = echter Roboter / Pollens duck-sim
robot = "tcp:127.0.0.1:7900"     # robotd-Adresse (per ssh -L umgeleitet, siehe README)
# tof = "tcp:127.0.0.1:7901"     # tofd für den Tiefensensor (zweiter Tunnel)
# Kopf-Kalibrierung, sobald der Roboter da ist: Vorzeichen für
# [neck_pitch, head_pitch, head_yaw, head_roll], falls er "falsch herum" schaut.
head_signs = [1.0, 1.0, 1.0, 1.0]

[claude]
model = "claude-sonnet-5-5"      # schneller und günstiger: "claude-haiku-5-5"
duck_name = "Quacki"
# Den API-Schlüssel NICHT hier eintragen, sondern in der App (Einstellungen) – dann liegt er im Tresor des
# Betriebssystems. Nur für Entwickler: Umgebungsvariable ANTHROPIC_API_KEY oder eine .env (siehe .env.example).

[voice]
stt = "browser"                  # "browser" (Chrome/Edge), "whisper" (lokal, privat) oder "aus"
whisper_model = "small"          # "base" schneller, "medium" genauer
wake_word = "ente"
tts = true                       # Antworten vorlesen

[engine]
idle_life = true                 # kleine Lebenszeichen im Leerlauf
obstacle_guard = true            # vor Hindernissen bremsen/stoppen
auto_recover = true              # nach Sturz selbst aufstehen

[memory]
enabled = true
# path = "D:\\Ente\\memory.json"  # leer = %LOCALAPPDATA%\duckpilot\memory.json (nicht in OneDrive)

[server]
host = "127.0.0.1"               # nur lokal erreichbar – so lassen
port = 8765
